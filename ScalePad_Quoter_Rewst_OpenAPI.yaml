                description: Time the tag was last updated.
                example: '2026-09-25T14:32:10Z'
                format: date-time
                type: string
              name:
                description: Display name of the tag.
                example: urgent
                type: string
          example:
          - created_at: '2026-09-25T14:32:10Z'
            id: tag_2TSEPTEfnooIhvA83l78R0nEqR5
            modified_at: '2026-09-25T14:32:10Z'
            name: urgent
        upfront_cost_decimal:
          description: Upfront cost before discount and tax.
          example: '50.00'
          nullable: true
          type: string
        upfront_discount_decimal:
          description: Discount applied to upfront items.
          example: '6.00'
          nullable: true
          type: string
        upfront_discounted_subtotal_decimal:
          description: Subtotal after discount for upfront items.
          example: '154.00'
          nullable: true
          type: string
        upfront_margin_decimal:
          description: Margin on upfront items.
          example: '30.00'
          type: string
        upfront_subtotal_decimal:
          description: Subtotal before tax and discount.
          example: '160.00'
          nullable: true
          type: string
        upfront_tax_total_decimal:
          description: Tax total for upfront items.
          example: '15.75'
          nullable: true
          type: string
        upfront_total_decimal:
          description: Final total for upfront items.
          example: '173.00'
          type: string
        uuid:
          description: Universally unique identifier for the quote.
          example: 1436-e2a121e6-d4b3-4d6b-9ad3-e8b877f8580f
          type: string
        won_at:
          description: Timestamp when the quote was marked as won.
          example: '2024-02-05T18:00:00Z'
          format: date-time
          type: string
        xero_invoice_id:
          description: External Xero intergration invoice ID for integration
          example: wxy901zab234
          nullable: true
          type: string
        zoho_deal_id:
          description: External Zoho intergration deal ID for integration
          example: cde567fgh890
          nullable: true
          type: string
    CreateQuoteSectionItem:
      type: object
      description: Payload for creating one section on a quote; carries the section display name.
      properties:
        name:
          description: Section name. Max 200 characters. Empty allowed.
          maxLength: 200
          nullable: true
          type: string
          example: Hardware & Services
    PatchLineItemRequest:
      type: object
      additionalProperties: false
      description: 'PATCH payload for a single line item. Every top-level field is

        optional; only the ones present in the request touch the stored

        row. `manufacturer`, `supplier`, `discount`, and

        `recurring_interval` accept JSON `null` to clear the field.

        `category` cannot be cleared; sending `null` on `category` returns

        422. `{}` on any nested object returns 422.

        '
      properties:
        category:
          allOf:
          - $ref: '#/components/schemas/PatchLineItemEntityRef'
          description: 'Category reference. ID-only resolution. Cannot be cleared —

            sending `null` or `{}` returns 422.

            '
          type: object
          example:
            id: cat_OcThl8SOeE8w6JYUznfrnQGdp94
        code:
          description: SKU-style code. Max 50 characters.
          maxLength: 50
          type: string
          example: R740-BASE
        description:
          description: Line item description. HTML.
          type: string
          example: <ul><li>Dual PSU</li><li>RAID Controller</li></ul>
        discount:
          allOf:
          - $ref: '#/components/schemas/PatchLineItemDiscount'
          description: 'Line-level discount. Send `null` to clear the stored discount;

            send an object with `input_type` and `input_decimal` to apply.

            `{}` returns 422.

            '
          nullable: true
          type: object
          example:
            input_type: percentage
            input_decimal: '5'
        manufacturer:
          allOf:
          - $ref: '#/components/schemas/PatchLineItemEntityRef'
          description: 'Manufacturer reference. Send `null` to clear the reference;

            send `{id: "..."}` to set. `{}` or `{id: ""}` returns 422.

            '
          nullable: true
          type: object
          example:
            id: manu_QeVjn0UQgG0y8LAWBpkupSIfr16
        name:
          description: Line item display name. Max 100 characters.
          maxLength: 100
          type: string
          example: PowerEdge R740 (updated)
        quantity_decimal:
          description: 'Quantity. Decimal string. Must be strictly greater than zero;

            fractional values are supported.

            '
          type: string
          example: '3.0000'
        recurring_interval:
          description: 'Recurring interval for the line. Send `null` to drop the line

            back to one-time; send a non-empty enum value to set. Empty

            string (`""`) returns 422. When non-null it must match the

            parent quote''s own `recurring_interval`.

            '
          enum:
          - monthly
          - quarterly
          - semi_annual
          - annual
          nullable: true
          type: string
          example: monthly
        sku:
          description: Supplier SKU. Max 50 characters.
          maxLength: 50
          type: string
          example: DELL-R740-2024
        supplier:
          allOf:
          - $ref: '#/components/schemas/PatchLineItemEntityRef'
          description: 'Supplier reference. Send `null` to clear the reference; send

            `{id: "..."}` to set. `{}` or `{id: ""}` returns 422.

            '
          nullable: true
          type: object
          example:
            id: sup_2awZ8VqGpFn1sMK6tPXkJbDrYhN
        taxable:
          description: Whether the line item participates in tax calculation.
          type: boolean
          example: true
        unit_cost_decimal:
          description: Per-unit cost. Decimal string. Non-negative.
          type: string
          example: '400.5678'
        unit_price_decimal:
          description: Per-unit price. Decimal string. Non-negative.
          type: string
          example: '799.0000'
    PatchLineItemEntityRef:
      type: object
      description: Reference to a related entity (category, manufacturer, or supplier) when patching a line item;
        resolution is by ID only.
      additionalProperties: false
      required:
      - id
      properties:
        id:
          description: 'Entity identifier. Must be a non-empty string when the object

            is present. Send `null` on the parent object (not on `id`) to

            clear the reference; `id: ""` and `id: null` return 422.

            '
          minLength: 1
          type: string
          example: cat_OcThl8SOeE8w6JYUznfrnQGdp94
    PatchLineItemDiscount:
      type: object
      description: Discount payload for a line-item patch. Specify the input value and whether it is an absolute
        amount or a percentage.
      additionalProperties: false
      required:
      - input_decimal
      - input_type
      properties:
        input_decimal:
          description: 'Discount value. Decimal string, non-negative. For `amount`, must

            not exceed the line subtotal (qty × unit_price). For

            `percentage`, must be in `[0, 100]`.

            '
          type: string
          example: '5'
        input_type:
          description: 'How the discount value is interpreted. `amount` is an absolute

            reduction; `percentage` is a fraction of the subtotal.

            '
          enum:
          - amount
          - percentage
          type: string
          example: percentage
    CreateLineItemRequestItem:
      type: object
      description: One entry in the batch payload for creating quote line items; carries pricing, quantity, taxability,
        discount, and category/manufacturer/supplier references.
      required:
      - category
      - name
      - quantity_decimal
      - unit_price_decimal
      properties:
        category:
          allOf:
          - $ref: '#/components/schemas/CreateLineItemEntityRef'
          description: 'Category reference. Required on every line item. Resolution is

            ID-only — passing `name` without `id` is rejected.

            '
          type: object
          example:
            id: cat_OcThl8SOeE8w6JYUznfrnQGdp94
        code:
          description: SKU-style code. Max 50 characters.
          maxLength: 50
          nullable: true
          type: string
          example: R740-BASE
        description:
          description: Line item description. HTML.
          nullable: true
          type: string
          example: <ul><li>Dual PSU</li><li>RAID Controller</li></ul>
        discount:
          allOf:
          - $ref: '#/components/schemas/CreateLineItemDiscount'
          description: 'Discount applied to the line. Omit for no discount.

            '
          nullable: true
          type: object
          example:
            input_type: amount
            input_decimal: '100.00'
        manufacturer:
          allOf:
          - $ref: '#/components/schemas/CreateLineItemEntityRef'
          description: Manufacturer reference. Resolution is ID-only.
          nullable: true
          type: object
          example:
            id: manu_QeVjn0UQgG0y8LAWBpkupSIfr16
        name:
          description: Line item display name. Max 100 characters.
          maxLength: 100
          type: string
          example: PowerEdge R740
        quantity_decimal:
          description: 'Quantity. Decimal string. Must be strictly greater than zero;

            fractional values are supported. Negative quantities are

            rejected.

            '
          type: string
          example: '2.5000'
        recurring_interval:
          description: 'Declares the line as recurring at this interval. Null means the

            line is one-time. When non-null, the value must match the

            quote''s own `recurring_interval` (a recurring quote rejects

            lines with a different interval; a one-time quote rejects any

            non-null value).

            '
          enum:
          - monthly
          - quarterly
          - semi_annual
          - annual
          nullable: true
          type: string
          example: monthly
        sku:
          description: Supplier SKU. Max 50 characters.
          maxLength: 50
          nullable: true
          type: string
          example: DELL-R740-2024
        supplier:
          allOf:
          - $ref: '#/components/schemas/CreateLineItemEntityRef'
          description: Supplier reference. Resolution is ID-only.
          nullable: true
          type: object
          example:
            id: sup_RfWko1VRhH1z9MBXCqlvqTJgs27
        taxable:
          description: 'Whether the line item participates in tax calculation. The

            quote''s tax codes apply only to taxable lines. Defaults to

            `true` when the field is omitted from the request body.

            '
          type: boolean
          default: true
          example: true
        unit_cost_decimal:
          description: 'Per-unit cost. Decimal string. Non-negative. Omit for cost-

            less lines (`unit_margin` then equals `unit_price`).

            '
          nullable: true
          type: string
          example: '400.00'
        unit_price_decimal:
          description: 'Per-unit price. Decimal string. Non-negative.

            '
          type: string
          example: '750.00'
    CreateLineItemEntityRef:
      type: object
      description: Reference to a related entity (category, manufacturer, or supplier) when creating a line item;
        resolution is by ID only.
      required:
      - id
      properties:
        id:
          description: Entity identifier. Required when the entity object is present.
          type: string
          example: cat_OcThl8SOeE8w6JYUznfrnQGdp94
        name:
          description: Optional name hint. Not used for resolution.
          nullable: true
          type: string
          example: Hardware
    CreateLineItemDiscount:
      type: object
      description: Line-item discount payload used when creating line items; specifies input value and whether it
        is an absolute amount or percentage.
      required:
      - input_decimal
      - input_type
      properties:
        input_decimal:
          description: 'Discount value. Decimal string, non-negative.

            For `amount`, must not exceed the line subtotal

            (qty × unit_price). For `percentage`, must be in `[0, 100]`.

            '
          type: string
          example: '100.00'
        input_type:
          description: 'How the discount value is interpreted. `amount` is an

            absolute reduction; `percentage` is a fraction of the

            subtotal.

            '
          enum:
          - amount
          - percentage
          type: string
          example: amount
    LineItemCreateRequest:
