    QuoteFile:
      type: object
      description: A file attachment referenced by a quote or line item, sourced from storage with metadata for
        filename, size, and download URL.
      required:
      - filename
      - id
      - size_bytes
      - url
      properties:
        filename:
          description: from `files.file_name`; null when source NULL.
          nullable: true
          type: string
          example: terms-and-conditions.pdf
        id:
          description: Public file identifier emitted verbatim from storage (already prefixed; mapper does not concat).
          nullable: true
          type: string
          example: file_2TSEPTEfnooIhvA83l78R0nEqR5
        size_bytes:
          description: from `files.file_size`; null when source NULL.
          nullable: true
          type: integer
          format: int64
          example: 234567
        url:
          description: Public download URL for this file. Null when the file is unavailable.
          nullable: true
          type: string
          example: https://api.quoter.com/v1/public/files/attachments/file_2TSEPTEfnooIhvA83l78R0nEqR5
    Address:
      type: object
      description: A physical address.
      required:
      - address_line_1
      - address_line_2
      - address_line_3
      - city
      - country_code
      - country_name
      - geo_spatial_coordinates
      - is_eu
      - postal_code
      - state_prov_code
      - state_prov_name
      properties:
        address_line_1:
          description: Primary street address.
          type: string
          example: 1021 W Hastings St
        address_line_2:
          description: Secondary street address (e.g., apartment or suite number).
          nullable: true
          type: string
          example: '#3200'
        address_line_3:
          description: Third line of address.
          nullable: true
          type: string
          example: null
        city:
          description: City.
          type: string
          example: Vancouver
        country_code:
          description: ISO-3166-1 alpha-2 country code.
          type: string
          pattern: ^[A-Z]{2}$
          example: CA
        country_name:
          description: Full country name.
          nullable: true
          type: string
          example: United States
        geo_spatial_coordinates:
          description: Geographic coordinates.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/GeoSpatialCoordinates'
          example:
            h3_cell_id: null
            latitude: null
            longitude: null
          properties:
            h3_cell_id:
              nullable: true
              type: string
            latitude:
              nullable: true
              type: string
            longitude:
              nullable: true
              type: string
        is_eu:
          description: Whether the address is in the EU.
          nullable: true
          type: boolean
          example: null
        postal_code:
          description: Postal or ZIP code.
          nullable: true
          type: string
          example: V5P-523
        state_prov_code:
          description: State or province code.
          nullable: true
          type: string
          example: BC
        state_prov_name:
          description: State or province name.
          nullable: true
          type: string
          example: Washington
      nullable: true
    GeoSpatialCoordinates:
      type: object
      description: Geospatial coordinates derived from an address, including latitude, longitude, and H3 spatial-index
        cell.
      required:
      - h3_cell_id
      - latitude
      - longitude
      properties:
        h3_cell_id:
          description: H3 spatial-index cell identifier. Null when not resolved.
          nullable: true
          type: string
          example: 8a2a1072b59ffff
        latitude:
          description: Latitude in decimal degrees, as a string.
          nullable: true
          type: string
          example: '47.6062'
        longitude:
          description: Longitude in decimal degrees, as a string.
          nullable: true
          type: string
          example: '-122.3321'
    QuoteClient:
      type: object
      description: ScalePad client associated with the quote's primary billing contact.
      required:
      - id
      - name
      properties:
        id:
          description: ScalePad client ID (from clients.sp_client_id). Null when not synced from the ScalePad side.
          nullable: true
          type: string
          example: 03840c4b-5999-49ac-80b6-0e6000a758fd
        name:
          description: Internal client name from clients.name; null when not set.
          nullable: true
          type: string
          example: Acme Corp
    QuoteOwner:
      type: object
      description: User the quote is assigned to (owner), identified by email, public user ID, and display name.
      required:
      - email
      - first_name
      - id
      - last_name
      properties:
        email:
          description: Owner email address.
          type: string
          example: alice@acme.com
        first_name:
          description: Owner first name. Null when the user has no first name recorded.
          nullable: true
          type: string
          example: Alice
        id:
          description: Public user identifier (`user_` prefix).
          type: string
          example: user_2TS1vcPVcHeXtQvqWvTVQYi33PY
        last_name:
          description: Owner last name. Null when the user has no last name recorded.
          nullable: true
          type: string
          example: Smith
    QuoteContact:
      type: object
      description: A contact person attached to the quote (currently the primary billing contact).
      required:
      - email
      - first_name
      - id
      - last_name
      - organization
      - primary
      properties:
        email:
          description: Contact email address.
          type: string
          example: john@acme.com
        first_name:
          nullable: true
          type: string
          example: John
        id:
          description: Public contact identifier.
          type: string
          example: 2awZ8VqGpFn1sMK6tPXkJbDrYhN
        last_name:
          nullable: true
          type: string
          example: Doe
        organization:
          nullable: true
          type: string
          example: Acme
        primary:
          description: True for the billing/primary contact.
          type: boolean
          example: true
    QuoteContentBlock:
      type: object
      description: A single rich-text block rendered as introductory or closing content on the quote layout.
      required:
      - body
      - id
      properties:
        body:
          description: HTML body of the content block.
          type: string
          example: <p>We are pleased to present this quote.</p>
        id:
          description: Public content block identifier (cblk_ prefix).
          nullable: true
          type: string
          example: cblk_5cdX8VqGpFn1sMK6tPXkJbDrYhN
    QuoteContentBlocks:
      type: object
      description: Wrapper grouping introductory and closing rich-text blocks displayed at the top and bottom of
        the quote.
      required:
      - closing
      - introductory
      properties:
        closing:
          description: Closing content blocks, ordered for display. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteContentBlock'
          example:
          - body: <p>Thanks for your business.</p>
            id: cblk_5cdX8VqGpFn1sMK6tPXkJbDrYhN
        introductory:
          description: Introductory content blocks, ordered for display. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteContentBlock'
          example:
          - body: <p>We are pleased to present this quote.</p>
            id: cblk_6deY9WrHqGo2tNL7uQYlKcEsZi0
    QuoteCoverPage:
      type: object
      description: Cover page configuration for the quote (title, subtitle, HTML content, header/footer flag, and
        optional background image).
      required:
      - body_image_url
      - content
      - show_header_footer
      - subtitle
      - title
      properties:
        body_image_url:
          description: URL of the cover page background image; null when not set.
          nullable: true
          type: string
          example: https://api.quoter.com/v1/public/files/images/file_234523rdsf23r423
        content:
          description: HTML body content of the cover page; null when not set.
          nullable: true
          type: string
          example: <p>Hello world!</p>
        show_header_footer:
          description: Whether to render the header/footer on the cover page.
          type: boolean
          example: true
        subtitle:
          description: Cover page subtitle; null when not set.
          nullable: true
          type: string
          example: amazing subtitle
        title:
          description: Cover page title; null when not set.
          nullable: true
          type: string
          example: Proposal for Acme Corp
    LineItemCustomField:
      type: object
      description: Custom label/value pair configured on an individual line item.
      required:
      - label
      - value
      properties:
        label:
          description: Field label as configured on the line item.
          type: string
          example: Warranty Tier
        value:
          description: Value entered for this field; null when storage is empty.
          nullable: true
          type: string
          example: Gold
    QuoteCustomField:
      type: object
      description: Custom label/value pair collected at quote creation or acceptance.
      required:
      - label
      - value
      properties:
        label:
          description: Field label as configured by the account.
          type: string
          example: PO Number
        value:
          description: Value entered for this field.
          type: string
          example: PO-2024-001
    QuoteCustomFields:
      type: object
      description: Quote-level custom field values grouped by the point of collection (quote creation vs. quote
        acceptance).
      required:
      - quote_acceptance
      - quote_creation
      properties:
        quote_acceptance:
          description: Custom fields collected at quote acceptance (checkout). Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteCustomField'
          example:
          - label: Signed By
            value: John Doe
        quote_creation:
          description: Custom fields collected at quote creation. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteCustomField'
          example:
          - label: PO Number
            value: PO-2024-001
