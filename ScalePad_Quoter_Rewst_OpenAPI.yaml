  /v1/contacts/{id}:
    get:
      summary: Fetch Contact
      operationId: fetchContact
      description: Retrieves a contact by its id. If the contact is not yet linked locally, a remote lookup is performed
        and the local record is backfilled with the resolved id (record_updated_at is not bumped by this backfill).
        Returns 404 if no match is found.
      tags:
      - Contacts
      security:
      - ApiKeyAuth: []
      parameters:
      - description: Unique identifier of the contact.
        in: path
        name: id
        required: true
        schema:
          example: 1g4123ty-4er6-4g3t-a345-wfe5e5234rfd
          type: string
      - $ref: '#/components/parameters/ContactQueryFields'
      responses:
        '200':
          $ref: '#/components/responses/ContactStatusCode200'
        '401':
          $ref: '#/components/responses/StatusCode401'
        '404':
          $ref: '#/components/responses/StatusCode404'
        '422':
          $ref: '#/components/responses/StatusCode422'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    patch:
      summary: Update Contact
      operationId: updateContact
      description: Updates a specific contact's information by its id. If the contact is not yet linked locally,
        a remote lookup is performed and the local record is backfilled before the update is applied. All fields
        are optional (PATCH semantics). The client field is not accepted on updates — any request containing a client
        field will be rejected with a 422.
      tags:
      - Contacts
      security:
      - ApiKeyAuth: []
      parameters:
      - description: Unique identifier of the contact.
        in: path
        name: id
        required: true
        schema:
          example: 1g4123ty-4er6-4g3t-a345-wfe5e5234rfd
          type: string
      - $ref: '#/components/parameters/ContactQueryFields'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ContactStatusCode200'
        '400':
          description: Bad request. Malformed request body.
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    description: Array of error objects containing details about each issue.
                    items:
                      type: object
                      required:
                      - code
                      - detail
                      - title
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code.
                          pattern: ^[A-Z][A-Z0-9_]*$
                          example: ERR_REQUEST_FORMAT_INVALID
                        detail:
                          type: string
                          description: Human-readable error detail.
                          example: The request format is invalid
                        title:
                          type: string
                          description: Short error title.
                          example: Bad Request
              examples:
                malformed_body:
                  summary: Malformed request body
                  description: The request body could not be parsed as JSON.
                  value:
                    errors:
                    - code: ERR_REQUEST_FORMAT_INVALID
                      detail: The request format is invalid
                      title: Bad Request
        '401':
          $ref: '#/components/responses/StatusCode401'
        '404':
          $ref: '#/components/responses/StatusCode404'
        '422':
          $ref: '#/components/responses/StatusCode422'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
components:
  schemas:
    CreateQuoteRequest:
      type: object
      description: Request payload for creating a new draft quote from a template.
      required:
      - contact
      - template_id
      properties:
        comments:
          description: Internal sales notes attached to the quote. Plain text.
          nullable: true
          type: string
          example: null
        contact:
          allOf:
          - $ref: '#/components/schemas/CreateQuoteContact'
          description: Primary billing contact reference on the new quote.
          example:
            email: john@acme.com
            client_id: 03840c4b-5999-49ac-80b6-0e6000a758fd
        cover_page_content:
          description: HTML body for the quote cover page.
          nullable: true
          type: string
          example: <p>Hello world!</p>
        cover_page_subtitle:
          description: Cover page subtitle. Max 125 characters.
          maxLength: 125
          nullable: true
          type: string
          example: amazing subtitle
        cover_page_title:
          description: Cover page title. Max 100 characters.
          maxLength: 100
          nullable: true
          type: string
          example: Proposal for Acme Corp
        currency_iso:
          description: 'ISO 4217 currency code (3 letters). Must be enabled on the

            account. When omitted, the account''s default currency applies.

            '
          nullable: true
          type: string
          example: USD
        custom_number:
          description: 'Caller-supplied quote number override. Max 250 characters.

            Leave null to let the system assign `quote_number` at publish.

            '
          maxLength: 250
          nullable: true
          type: string
          example: Q-2024-001
        expired_at:
          description: 'Quote expiration date. RFC 3339 timestamp. Must not be in the

            past. When null, the account''s default expiration window

            applies at publish time.

            '
          format: date-time
          nullable: true
          type: string
          example: '2024-12-31T00:00:00Z'
        internal_notes:
          description: Private notes on the quote, not shown to the contact.
          nullable: true
          type: string
          example: null
        name:
          description: Quote display name. Max 75 characters.
          maxLength: 75
          nullable: true
          type: string
          example: Server Infrastructure Upgrade
        owner:
          allOf:
          - $ref: '#/components/schemas/CreateQuoteOwner'
          description: 'Assigns the quote to a specific user by email. When omitted or

            set to `null`, the quote defaults to the authenticated user

            resolved from the API key. The referenced user must belong to

            the same account or the request fails with

            `ERR_OWNER_EMAIL_NOT_FOUND`.

            '
          nullable: true
          type: object
          example:
            email: alice@acme.com
        tax_codes:
          description: Quote-level tax codes to apply. Each entry carries the label and rate inline.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/CreateQuoteTaxCode'
          example:
          - code: HST
            number: RC30012020
            rate_decimal: '13.00'
        template_id:
          description: Quote template public ID to seed content from.
          type: string
          example: qtpl_2awZ8VqGpFn1sMK6tPXkJbDrYhN
    CreateQuoteContact:
      type: object
      description: Primary billing contact reference (email plus a client identifier or name) used to look up the
        contact on the new quote.
      required:
      - email
      properties:
        email:
          description: Contact email address.
          format: email
          type: string
          example: john@acme.com
        client_id:
          description: 'Client identifier. Provide this when the caller holds a

            client id from a linked system. At least one of `client_id`

            or `client_name` must be present; if both are supplied,

            `client_id` wins and `client_name` is ignored.

            '
          nullable: true
          type: string
          example: 03840c4b-5999-49ac-80b6-0e6000a758fd
        client_name:
          description: 'Client name used to look up the client on the account when a

            `client_id` is not available. The first client whose name

            matches exactly is used. At least one of `client_id` or

            `client_name` must be present; when both are supplied,

            `client_id` wins and `client_name` is ignored.


            When the tuple path resolves the client, the value must be

            at most 255 characters. When `client_id` is supplied the

            value is not consulted and any length is accepted.

            '
          maxLength: 255
          nullable: true
          type: string
          example: Acme Corp
    CreateQuoteOwner:
      type: object
      description: Owner assignment (by email) for the new quote; must match an active user on the same account.
      required:
      - email
      properties:
        email:
          description: 'Email of the user to assign as the quote owner. Must match an

            active user on the same account; unknown emails return

            `ERR_OWNER_EMAIL_NOT_FOUND` (422). Lookup is account-scoped —

            emails from other tenants never resolve.

            '
          format: email
          type: string
          example: alice@acme.com
    CreateQuoteTaxCode:
      type: object
      description: Ad-hoc tax code entry applied at the quote level, including label, rate, and optional registration
        number.
      required:
      - code
      - rate_decimal
      properties:
        code:
          description: Tax code label (e.g. `HST`, `VAT`). Required for every ad-hoc entry.
          type: string
          example: HST
        number:
          description: Tax registration number to display on the quote.
          nullable: true
          type: string
          example: RC30012020
        rate_decimal:
          description: 'Tax rate as a decimal percentage (e.g. `"13.00"` = 13%). Required

            for every ad-hoc entry.

            '
          type: string
          example: '13.00'
    QuoteFetchResponse:
      type: object
      description: Full display payload for a single quote revision.
      required:
      - attachments
      - billing_address
      - client
      - comments
      - contacts
      - content_blocks
      - cover_page
      - currency_iso
      - custom_fields
      - custom_number
      - draft
      - expired_at
      - id
      - internal_notes
      - name
      - number
      - owner
      - pricing_split_order
      - primary
      - record_created_at
      - record_updated_at
      - revision
      - sections
      - shipping_address
      - template_id
      - totals
      properties:
        attachments:
          description: Quote-level file attachments. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteFile'
          example:
          - filename: terms-and-conditions.pdf
            id: file_2TSEPTEfnooIhvA83l78R0nEqR5
            size_bytes: 234567
            url: https://api.quoter.com/v1/public/files/attachments/file_2TSEPTEfnooIhvA83l78R0nEqR5
        billing_address:
          description: Billing address sourced from the primary contact.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/Address'
          example:
            address_line_1: 225 Cedar Street
            address_line_2: null
            address_line_3: null
            city: Seattle
            country_code: US
            country_name: null
            geo_spatial_coordinates:
              h3_cell_id: null
              latitude: null
              longitude: null
            is_eu: null
            postal_code: '98121'
            state_prov_code: WA
            state_prov_name: null
        client:
          description: Scalepad client associated with the primary billing contact.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteClient'
          example:
            id: 03840c4b-5999-49ac-80b6-0e6000a758fd
            name: Acme Corp
        comments:
          description: Internal sales notes attached to the quote. Null when not set.
          nullable: true
          type: string
          example: null
        contacts:
          description: 'Primary billing contact for this quote. Currently returns at

            most one entry (multi-contact quotes are a future extension).

            Null when no contact resolves.

            '
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteContact'
          example:
          - email: john@acme.com
            first_name: John
            id: 2awZ8VqGpFn1sMK6tPXkJbDrYhN
            last_name: Doe
            organization: Acme
            primary: true
        content_blocks:
          description: Introductory and closing rich-text blocks.
          allOf:
          - $ref: '#/components/schemas/QuoteContentBlocks'
          example:
            closing: null
            introductory: null
        cover_page:
          description: Cover page configuration; null when no cover page is set.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteCoverPage'
          example:
            body_image_url: null
            content: <p>Hello world!</p>
            show_header_footer: false
            subtitle: amazing subtitle
            title: Proposal for Acme Corp
        currency_iso:
          description: ISO 4217 currency code used throughout this quote.
          type: string
          example: CAD
        custom_fields:
          description: Custom fields grouped by collection point.
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteCustomFields'
          example:
            quote_acceptance: null
            quote_creation: null
        custom_number:
          description: User-supplied quote number override.
          nullable: true
          type: string
          example: Quote Custom Number
        draft:
          description: True when this revision has not yet been published.
          type: boolean
          example: false
        expired_at:
          description: RFC 3339 timestamp of the quote's expiration. Null when not set.
          nullable: true
          type: string
          format: date-time
          example: '2024-12-31T00:00:00Z'
        id:
          description: identifier for this quote revision (quot_ prefix).
          type: string
          example: quot_2TSEPTEfnooIhvA83l78R0nEqR5
        internal_notes:
          description: Private notes on the quote, not shown to the contact. Null when not set.
          nullable: true
          type: string
          example: null
        name:
          description: Display name of the quote.
          type: string
          example: Server Infrastructure Upgrade
        number:
          description: System-assigned sequential quote number.
          type: string
          example: '55'
        owner:
          allOf:
          - $ref: '#/components/schemas/QuoteOwner'
          description: 'User the quote is assigned to (resolved from `leads.user_id`

            via cityhall). Null when the quote has no owner or when the

            referenced user has been deleted.

            '
          nullable: true
          type: object
          example:
            id: user_2TS1vcPVcHeXtQvqWvTVQYi33PY
            email: alice@acme.com
            first_name: Alice
            last_name: Smith
        pricing_split_order:
          description: 'Presentation order of recurring vs. one-time pricing sections. `none` is the default when
            the quote does not split pricing.

            '
          type: string
          enum:
          - none
          - one_time_first
          - recurring_first
          example: recurring_first
        primary:
          description: True when this is the current primary revision of the quote.
          type: boolean
          example: true
        record_created_at:
          description: RFC 3339 timestamp of when the quote was created.
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        record_updated_at:
          description: RFC 3339 timestamp of the most recent update.
          type: string
          format: date-time
          example: '2024-01-15T15:45:00Z'
        revision:
          description: Monotonically increasing revision counter. Null when no revision has been recorded (revision
            0 does not exist in the domain).
          nullable: true
          type: string
          example: '2'
        sections:
          description: Ordered list of quote sections, each containing line items. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteSection'
          example:
          - id: qsec_2awZ8VqGpFn1sMK6tPXkJbDrYhN
            name: Hardware & Services
            optional_group_id: null
            optional_selected: true
            discount_application: null
