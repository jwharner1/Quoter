          type: string
          example: cat_OcThl8SOeE8w6JYUznfrnQGdp94
          description: The unique identifier of the parent category, if any.
    ItemCreateRequest:
      type: object
      description: Used to create a new item in the system.
      properties:
        allow_decimal_quantities:
          type: boolean
          example: true
          description: Whether the item can be sold in fractional quantities.
        category:
          type: string
          example: SSDs
          description: Name of the category to which the item belongs. Required; cannot be provided with category_id.
        category_id:
          type: string
          example: cat_OcThl8SOeE8w6JYUznfrnQGdp94
          description: ID of the category to which the item belongs. Required; cannot be provided with category.
        code:
          type: string
          example: MZ-V7S1T0B/AM
          description: Custom reference code for the item.
        cost_decimal:
          type: string
          example: '50.50'
          description: Unit cost of the item as a decimal. If provided, pricing_scheme must be flat, per_unit, or
            percentage.
        cost_type:
          type: string
          enum:
          - amount
          - percentage
          example: amount
          description: Type of cost (e.g., amount, percentage), used to interpret the cost value. If provided, pricing_scheme
            must be flat, per_unit, or percentage; required if cost is provided. Defaults to amount if not specified.
        description:
          type: string
          example: The 970 EVO Plus reaches sequential read/write speeds up to 3,500/3,300 MB/s, up to 53% faster
            than the 970 EVO.
          description: Textual description of the item.
        internal_note:
          type: string
          example: Check warehouse for inventory before ordering.
          description: Private notes about the item, not visible to customers.
        manufacturer:
          type: string
          example: Samsung
          description: Name of the item's manufacturer. Cannot be provided with manufacturer_id.
        manufacturer_id:
          type: string
          example: manu_OcThlEWcbhAG52u3vLJodwnV88k
          description: Unique ID of the manufacturer. Cannot be provided with manufacturer.
        name:
          type: string
          example: SAMSUNG 970 EVO PLUS M.2 2280 1TB PCIe Gen 3.0 x4
          description: Name of the item being created.
        percentage_price_category_ids:
          type: array
          items:
            type: string
          description: Category IDs used for percentage-based pricing. If provided, pricing_scheme must be percentage;
            required if pricing_scheme is percentage.
          example:
          - cat_OcThlTV6Tama8RH5Zh4Jfw1fhJC
        percentage_price_decimal:
          type: string
          example: '50.50'
          description: The percentage markup or markdown used in pricing. If provided, pricing_scheme must be percentage;
            required if pricing scheme is percentage.
        price_decimal:
          type: string
          example: '50.50'
          description: Price of the item in decimal format. If provided, pricing_scheme must be flat or per_unit;
            validate decimal.
        pricing_scheme:
          type: string
          enum:
          - per_unit
          - flat
          - tiered_volume
          - tiered_stepped
          - percentage
          example: per_unit
          description: Method used for pricing, such as flat, per_unit, or percentage. Defaults to per_unit if omitted.
        quantity_help_tip:
          type: string
          example: Enter the number of units required.
          description: Help text to guide users on how to select quantity.
        recurring:
          type: boolean
          example: true
          description: Indicates whether the item is billed on a recurring basis.
        recurring_interval:
          type: string
          example: annually
          enum:
          - monthly
          - quarterly
          - semi_annually
          - annually
          description: Time interval for recurring billing (e.g., monthly, yearly). If provided, recurring must
            be true; required if recurring is true.
        restrict_discounting:
          type: boolean
          example: true
          description: Prevents discounts from being applied to this item.
        show_option_prices:
          type: boolean
          example: true
          description: Indicates whether option prices should be displayed alongside item price.
        sku:
          type: string
          example: N82E16820147743
          description: Unique product code used for tracking inventory.
        supplier:
          type: string
          example: Newegg
          description: Name of the item's supplier. Cannot be provided with supplier_id.
        supplier_id:
          type: string
          example: sup_OcThlLwzLAM7m5eK1WEKkXUQZtm
          description: ID of the item's supplier. Cannot be provided with supplier.
        taxable:
          type: boolean
          example: true
          description: Whether the item is subject to tax. Defaults to true if omitted.
        weight_decimal:
          type: string
          example: '50.50'
          description: Item weight in decimal format.
      required:
      - category_id
      - name
