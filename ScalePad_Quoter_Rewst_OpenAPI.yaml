        '400':
          description: Malformed request body (unparseable JSON).
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    description: Array of error objects containing details about each issue.
                    items:
                      type: object
                      required:
                      - code
                      - detail
                      - title
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code.
                          pattern: ^[A-Z][A-Z0-9_]*$
                          example: ERR_INVALID_FILTER_OPERATOR
                        detail:
                          type: string
                          description: Human-readable error detail.
                          example: Invalid filter operator
                        title:
                          type: string
                          description: Short error title.
                          example: Unprocessable Entity
              examples:
                malformed_body:
                  summary: Malformed request body
                  description: The request body could not be parsed as JSON.
                  value:
                    errors:
                    - code: ERR_REQUEST_FORMAT_INVALID
                      detail: The request format is invalid
                      title: Bad Request
        '422':
          description: 'Validation failure. Every problem found in the request is

            reported together in a single `errors` array rather than one

            per response.


            Includes `ERR_NO_CLIENT_IDENTIFIER` when neither `client_id` nor

            `client_name` is provided, invalid `expired_at`, `currency_iso`

            mismatch, a malformed `contact.email`

            (`ERR_CONTACT_EMAIL_INVALID`) or `owner.email`

            (`ERR_OWNER_EMAIL_INVALID`), and — when `owner.email` is

            supplied — an email that was not found

            (`ERR_OWNER_EMAIL_NOT_FOUND`).


            References that are not found are reported here too:

            `ERR_TEMPLATE_NOT_FOUND` for `template_id`,

            `ERR_CLIENT_NOT_FOUND` for `client_id` or `client_name`, and

            `ERR_CONTACT_NOT_FOUND` for `contact.email`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    description: Array of error objects containing details about each issue.
                    items:
                      type: object
                      required:
                      - code
                      - detail
                      - title
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code.
                          pattern: ^[A-Z][A-Z0-9_]*$
                          example: ERR_INVALID_FILTER_OPERATOR
                        detail:
                          type: string
                          description: Human-readable error detail.
                          example: Invalid filter operator
                        title:
                          type: string
                          description: Short error title.
                          example: Unprocessable Entity
              examples:
                template_not_found:
                  summary: Quote template not found
                  description: The `template_id` in the request was not found.
                  value:
                    errors:
                    - code: ERR_TEMPLATE_NOT_FOUND
                      detail: template_id not found
                      title: Unprocessable Entity
                client_not_found:
                  summary: Client not found
                  description: Neither `client_id` nor `client_name` was found.
                  value:
                    errors:
                    - code: ERR_CLIENT_NOT_FOUND
                      detail: contact.client_name not found
                      title: Unprocessable Entity
                contact_not_found:
                  summary: Contact not found
                  description: The `contact.email` was not found.
                  value:
                    errors:
                    - code: ERR_CONTACT_NOT_FOUND
                      detail: contact.email not found
                      title: Unprocessable Entity
                multiple_unresolved_references:
                  summary: Several problems in one response
                  description: All resolution failures found in the request are returned together.
                  value:
                    errors:
                    - code: ERR_TEMPLATE_NOT_FOUND
                      detail: template_id not found
                      title: Unprocessable Entity
                    - code: ERR_CLIENT_NOT_FOUND
                      detail: contact.client_name not found
                      title: Unprocessable Entity
                contact_email_invalid:
                  summary: Malformed contact email
                  description: The `contact.email` supplied is not a valid email address.
                  value:
                    errors:
                    - code: ERR_CONTACT_EMAIL_INVALID
                      detail: contact.email is not a valid email address
                      title: Unprocessable Entity
                owner_email_invalid:
                  summary: Malformed owner email
                  description: The `owner.email` supplied is not a valid email address.
                  value:
                    errors:
                    - code: ERR_OWNER_EMAIL_INVALID
                      detail: owner.email is not a valid email address
                      title: Unprocessable Entity
                owner_email_not_found:
                  summary: Owner email not resolved
                  description: The `owner.email` supplied was not found.
                  value:
                    errors:
                    - code: ERR_OWNER_EMAIL_NOT_FOUND
                      detail: owner.email not found
                      title: Unprocessable Entity
                no_client_identifier:
                  summary: Neither client_id nor client_name supplied
                  description: The `contact` object must include at least one of `client_id` or `client_name`.
                  value:
                    errors:
                    - code: ERR_NO_CLIENT_IDENTIFIER
                      detail: contact requires one of client_id or client_name
                      title: Unprocessable Entity
                client_name_too_long:
                  summary: client_name exceeds the length limit
                  description: When the tuple path resolves the client, `client_name` must be at most 255 characters.
                  value:
                    errors:
                    - code: ERR_CLIENT_NAME_TOO_LONG
                      detail: contact.client_name exceeds 255 character limit
                      title: Unprocessable Entity
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
