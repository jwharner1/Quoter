      description: Represents a product or service available for quoting.
      properties:
        allow_decimal_quantities:
          type: boolean
          example: true
          description: Whether the item can be sold in fractional quantities.
        category:
          type: string
          example: SSDs
          description: Name of the category to which the item belongs.
