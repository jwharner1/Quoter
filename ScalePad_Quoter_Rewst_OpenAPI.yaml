      summary: List Quotes
  /v1/quotes/{quote_id}:
    get:
      summary: Fetch Quote
      description: 'Retrieves a quote revision with the full display payload — sections, line items, totals, contacts,
        content blocks, custom fields, and taxes. Both primary and draft revisions are returned; callers inspect
        the `primary` and `draft` flags to determine state.


        Quotes created before **2025-06-17** may not be retrievable through this endpoint at this time. Such a quote
        can still be returned by the list endpoint while this endpoint responds `404` for it.

        '
      operationId: fetchQuote
      tags:
      - Quotes
      security:
      - ApiKeyAuth: []
      parameters:
      - name: quote_id
        in: path
        required: true
        description: Quote ID.
        schema:
          type: string
          example: quot_2TSEPTEfnooIhvA83l78R0nEqR5
      responses:
        '200':
          $ref: '#/components/responses/QuoteStatusCode200'
        '404':
          description: Quote not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    description: Array of error objects containing details about each issue.
                    items:
                      type: object
                      required:
                      - code
                      - detail
                      - title
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code.
                          pattern: ^[A-Z][A-Z0-9_]*$
                          example: ERR_INVALID_FILTER_OPERATOR
                        detail:
                          type: string
                          description: Human-readable error detail.
                          example: Invalid filter operator
                        title:
                          type: string
                          description: Short error title.
                          example: Unprocessable Entity
              examples:
                quote_not_found:
                  summary: Quote not found
                  description: The `quote_id` path parameter does not resolve to a quote on this account.
                  value:
                    errors:
                    - code: ERR_QUOTE_NOT_FOUND
                      detail: Quote not found
                      title: Not Found
        '422':
          description: Quote uses an external tax provider and cannot be retrieved through this endpoint at this
            time.
          content:
            application/json:
              schema:
                type: object
                required:
                - errors
                properties:
                  errors:
                    type: array
                    description: Array of error objects containing details about each issue.
                    items:
                      type: object
                      required:
                      - code
                      - detail
                      - title
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code.
                          pattern: ^[A-Z][A-Z0-9_]*$
                          example: ERR_INVALID_FILTER_OPERATOR
                        detail:
                          type: string
                          description: Human-readable error detail.
                          example: Invalid filter operator
                        title:
                          type: string
                          description: Short error title.
                          example: Unprocessable Entity
              examples:
                external_taxes:
                  summary: Quote uses external tax provider
                  description: The quote's tax calculation is delegated to an external provider and cannot be served
                    by this endpoint.
                  value:
                    errors:
                    - code: ERR_QUOTE_HAS_EXTERNAL_TAXES
                      detail: This quote cannot be retrieved through this endpoint
                      title: Unprocessable Entity
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
