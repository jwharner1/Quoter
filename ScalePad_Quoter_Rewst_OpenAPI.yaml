      - bundle_line_item_id
      - bundle_publicly_visible
      - category
      - code
      - custom_fields
      - description
      - discount_input_decimal
      - discount_input_type
      - id
      - images
      - manufacturer
      - name
      - optional
      - optional_group_id
      - optional_selected
      - options
      - quantity_decimal
      - sku
      - supplier
      - taxable
      - totals
      - unit_cost_decimal
      - unit_margin_decimal
      - unit_margin_percentage
      - unit_price_decimal
      properties:
        attachments:
          description: 'Line item files where `files.is_image = 0`.

            Image files are emitted under `images[]`; top-level quote attachments are not split.

            Null when empty.'
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteFile'
          example:
          - filename: spec-sheet.pdf
            id: file_2TSEPTEfnooIhvA83l78R0nEqR5
            size_bytes: 234567
            url: https://api.quoter.com/v1/public/files/attachments/file_2TSEPTEfnooIhvA83l78R0nEqR5
        bundle:
          description: True when this line item is a product bundle.
          type: boolean
          example: false
        bundle_line_item_id:
          description: ID of the parent bundle line item when this line item belongs to a bundle; null for top-level
            items.
          nullable: true
          type: string
          example: null
        bundle_publicly_visible:
          description: Line item visibility flag from `line_items.publicly_visible`. Emitted for every line item
            regardless of bundle status.
          type: boolean
          example: true
        category:
          description: Catalog category; null when uncategorized.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteLineItemCategory'
          example:
            id: cat_OcThl8SOeE8w6JYUznfrnQGdp94
            name: Monitor
            parent_category: Hardware
            parent_category_id: cat_PdUim9TPfF9x7KZVAogsoRHeq05
        code:
          description: Product code or part number; null when not set.
          nullable: true
          type: string
          example: R740-BASE
        custom_fields:
          description: Line-item custom fields, flat list. Null when empty. Unlike quote-level custom_fields, no
            bucketing - line-item custom fields have no on_checkout flag.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/LineItemCustomField'
          example:
          - label: Warranty Tier
            value: Gold
        description:
          description: Rich-text product description; null when not set.
          nullable: true
          type: string
          example: <ul><li>Dual PSU</li><li>RAID Controller</li></ul>
        discount_input_decimal:
          description: 'Discount value entered by the user, rounded to two decimals.

            Null when no discount is set. `"0.00"` when the discount is

            explicitly set to zero.

            '
          nullable: true
          type: string
          example: '100.00'
        discount_input_type:
          description: 'Discount type: "amount" or "percentage"; null when no discount.'
          nullable: true
          type: string
          example: amount
        id:
          description: Public line item identifier (litm_ prefix).
          type: string
          example: litm_2awZ8VqGpFn1sMK6tPXkJbDrYhN
        images:
          description: 'Line item files where `files.is_image = 1`.

            Non-image files are emitted under `attachments[]`; top-level quote attachments are not split.

            Null when empty.'
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteFile'
          example:
          - filename: poweredge-r740.png
            id: file_3UvFTFghpqvjIweB94m89S1nFsS6
            size_bytes: 98211
            url: https://api.quoter.com/v1/public/files/images/file_3UvFTFghpqvjIweB94m89S1nFsS6
        manufacturer:
          description: Manufacturer reference; null when not assigned.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteEntityRef'
          example:
            id: manu_QeVjn0UQgG0y8LAWBpkupSIfr16
            name: Dell
        name:
          description: Product or service name.
          type: string
          example: PowerEdge R740
        optional:
          description: True when this line item can be toggled by the buyer.
          type: boolean
          example: false
        optional_group_id:
          description: Selectable group ID; null when not part of a group.
          nullable: true
          type: string
          example: null
        optional_selected:
          description: True when this optional line item is currently selected.
          type: boolean
          example: false
        options:
          description: Configurable options with selectable values. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineItemOption'
          example:
          - name: RAM Size
            values:
            - label: 64GB DDR4
              cost_decimal: '200'
              price_input_decimal: '400.5678'
              price_amount_decimal: '400.5678'
              margin_decimal: null
              selected: true
        quantity_decimal:
          description: Quantity as stored — raw, unrounded. Supports fractional quantities (e.g. partial-hour services).
            Null for zero quantity.
          nullable: true
          type: string
          example: '2.5000'
        sku:
          description: Supplier SKU; null when not set.
          nullable: true
          type: string
          example: DELL-R740-2024
        supplier:
          description: Supplier reference; null when not assigned.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteEntityRef'
          example:
            id: sup_RfWko1VRhH1z9MBXCqlvqTJgs27
            name: Tech Distribution Corp
        taxable:
          description: Whether this line item is subject to tax.
          type: boolean
          example: true
        totals:
          description: Line item totals per billing term.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/QuoteLineItemTotals'
          example:
            annual:
              cost_decimal: '0.00'
              discount_decimal: '0.00'
              discounted_subtotal_decimal: '0.00'
              margin_decimal: '0.00'
              subtotal_decimal: '0.00'
            monthly:
              cost_decimal: '800.00'
              discount_decimal: '100.00'
              discounted_subtotal_decimal: '1400.00'
              margin_decimal: '600.00'
              subtotal_decimal: '1500.00'
            one_time:
              cost_decimal: '800.00'
              discount_decimal: '100.00'
              discounted_subtotal_decimal: '1400.00'
              margin_decimal: '600.00'
              subtotal_decimal: '1500.00'
            quarterly:
              cost_decimal: '0.00'
              discount_decimal: '0.00'
              discounted_subtotal_decimal: '0.00'
              margin_decimal: '0.00'
              subtotal_decimal: '0.00'
            semi_annual:
              cost_decimal: '0.00'
              discount_decimal: '0.00'
              discounted_subtotal_decimal: '0.00'
              margin_decimal: '0.00'
              subtotal_decimal: '0.00'
            upfront:
              cost_decimal: '800.00'
              discount_decimal: '100.00'
              discounted_subtotal_decimal: '1400.00'
              margin_decimal: '600.00'
              subtotal_decimal: '1500.00'
        unit_cost_decimal:
          description: 'Per-unit cost. Unrounded; may carry more than two decimals

            when the caller supplied higher precision. Null when the

            cost is not set; `"0"` when the cost is explicitly zero.

            '
          nullable: true
          type: string
          example: '400.5678'
        unit_margin_decimal:
          description: 'Per-unit margin in dollars before discount, rounded to two

            decimals. Null when the margin is not set; `"0.00"` when it

            is explicitly zero.

            '
          nullable: true
          type: string
          example: '350.00'
        unit_margin_percentage:
          description: 'Per-unit margin as a percentage of unit price. Unrounded.

            Null when the margin is not set; `"0"` when it is explicitly

            zero.

            '
          nullable: true
          type: string
          example: '46.67'
        unit_price_decimal:
          description: 'Per-unit price. Unrounded; may carry more than two decimals

            when the caller supplied higher precision. Null when the

            price is not set; `"0"` when it is explicitly zero.

            '
          nullable: true
          type: string
          example: '750.1234'
    QuoteLineItemCategory:
      type: object
      description: Catalog category assigned to a line item, with identifier, name, and optional parent-category
        reference.
      required:
      - id
      - name
      - parent_category
      - parent_category_id
      properties:
        id:
          description: Category identifier emitted verbatim from storage; the DB carries the entity prefix and the
            mapper does not concat.
          nullable: true
          type: string
          example: cat_OcThl8SOeE8w6JYUznfrnQGdp94
        name:
          description: Category display name.
          nullable: true
          type: string
          example: Monitor
        parent_category:
          description: Parent category display name; null for top-level categories.
          nullable: true
          type: string
          example: Hardware
        parent_category_id:
          description: Parent category identifier emitted verbatim from storage; null for top-level. Mapper does
            not concat any prefix.
          nullable: true
          type: string
          example: cat_PdUim9TPfF9x7KZVAogsoRHeq05
    QuoteEntityRef:
      type: object
      description: Minimal reference to a manufacturer or supplier entity.
      required:
      - id
      - name
      properties:
        id:
          description: identifier emitted verbatim from storage; the DB carries the entity-specific prefix (manu_,
            sup_, etc.) and the mapper does not concat.
          nullable: true
          type: string
          example: manu_QeVjn0UQgG0y8LAWBpkupSIfr16
        name:
          description: Entity display name.
          nullable: true
          type: string
          example: Dell
    QuoteLineItemOption:
      type: object
      description: A configurable option on a line item (e.g. RAM Size) with an ordered list of selectable values.
      required:
      - name
      - values
      properties:
        name:
          description: Option name.
          type: string
          example: RAM Size
        values:
          description: Selectable values for this option. Null when empty.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineItemOptionValue'
          example:
          - label: 64GB DDR4
            cost_decimal: '200'
            price_input_decimal: '400.5678'
            price_amount_decimal: '400.5678'
            margin_decimal: null
            selected: true
    QuoteLineItemOptionValue:
      type: object
      description: One selectable value inside a line item option (label, cost, price, margin, and whether it is
        currently selected).
      required:
      - cost_decimal
      - label
      - margin_decimal
      - price_amount_decimal
      - price_input_decimal
      - selected
      properties:
        cost_decimal:
          description: Option cost as stored — raw, unrounded. Null when not set.
          nullable: true
          type: string
          example: '200'
        label:
          description: Display label for this option value.
          type: string
          example: 64GB DDR4
        margin_decimal:
          description: Margin amount for this option value; null when not set.
          nullable: true
          type: string
          example: null
        price_amount_decimal:
          description: Calculated option price (delta added to the line-item unit price when selected) as stored
            — raw, unrounded.
          nullable: true
          type: string
          example: '400.5678'
        price_input_decimal:
          description: Raw option price input as entered by the quote author — raw, unrounded.
          nullable: true
          type: string
          example: '400.5678'
        selected:
          description: Whether this value is currently selected.
          type: boolean
          example: true
