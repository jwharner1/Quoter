openapi: 3.0.3
info:
  version: 1.0.0
  title: ScalePad Quoter API for Rewst
  description: 'Quoter-only integration assembled from the official ScalePad developer portal OpenAPI definitions.
    API version: v1. Includes all 59 operations listed under Quoter API in the documentation index at the time of
    collection. Authentication: send your ScalePad personal API key in the x-api-key header; no token request is
    required. Quoter is documented as US-only. The deprecated Create Line Item operation sunsets on 2027-10-31;
    prefer Create Quote Line Items. Request/response schemas and pagination are preserved from the official definitions.
    For paginated list actions, send the documented page_size and cursor values and continue with next_cursor until
    exhausted. Complex quote request bodies and pagination may need manual action configuration in Rewst. This file
    has been validated as OpenAPI 3.0.3 but has not been imported into Rewst or tested against a live tenant.'
  contact:
    name: ScalePad Support
    url: https://support.scalepad.com
    email: support@scalepad.com
servers:
- url: https://api.scalepad.com/quoter
  description: US (default)
tags:
- name: Quotes
  description: Create, fetch, list, publish, and modify quotes.
- name: Quote Sections
  description: Manage sections within a quote.
- name: Quote Section Line Items
  description: Manage line items on a section of a quote.
- name: Line Items
  description: Standalone line item operations.
- name: Quote Templates
  description: List quote templates used to seed new quotes.
- name: Categories
  description: Manage product categories in the catalog.
- name: Items
  description: Manage catalog items.
- name: Item Groups
  description: Manage item groups and their membership.
- name: Item Options
  description: Manage item options and option values.
- name: Item Tiers
  description: Manage tiered pricing for items.
- name: Manufacturers
  description: Manage manufacturers referenced by catalog items.
- name: Suppliers
  description: Manage catalog suppliers.
- name: Data Feed Suppliers
  description: Query supplier item feeds sourced via SupplierSync.
- name: Contacts
  description: Manage individual and organization contacts.
security:
- ApiKeyAuth: []
paths:
  /v1/quotes:
    post:
      summary: Create Quote
      description: 'Creates a new draft quote from a template. The contact is

        identified by email plus either `client_id` or `client_name`;

        when both are provided, `client_id` is used. The referenced

        contact must already exist on the account. Sections and line

        items are added via their own endpoints after creation.


        Response body matches `GET /v1/quotes/{quote_id}`.

        '
      operationId: createQuote
      tags:
      - Quotes
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
            example:
              comments: null
              contact:
                email: john@acme.com
                client_name: Acme Corp
              cover_page_content: <p>Hello world!</p>
              cover_page_subtitle: amazing subtitle
              cover_page_title: Proposal for Acme Corp
              currency_iso: CAD
              custom_number: Quote Custom Number
              expired_at: '2024-12-31T00:00:00Z'
              internal_notes: null
              name: Server Infrastructure Upgrade
              owner:
                email: alice@acme.com
              tax_codes:
              - code: HST
                number: RC30012020
                rate_decimal: '13.00'
              template_id: qtpl_2awZ8VqGpFn1sMK6tPXkJbDrYhN
      responses:
        '201':
          description: 'Quote created. Returns the full fetch-shape payload for the new

            draft. On create, `sections`, `content_blocks`, `attachments`,

            `custom_fields.*`, `totals`, `billing_address`, and

            `shipping_address` are empty — sections and line items are

            added via their own endpoints.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteFetchResponse'
              example:
                attachments: null
                billing_address:
                  address_line_1: 225 Cedar Street
                  address_line_2: null
                  address_line_3: null
                  city: Seattle
                  country_code: US
                  country_name: United States
                  geo_spatial_coordinates:
