        quarterly_amount_decimal:
          description: Tax amount for the quarterly recurring bucket; populated only when the quote's recurring
            interval is quarterly.
          nullable: true
          type: string
          example: null
        rate_decimal:
          description: Tax rate as a percentage string. Null when the rate is not set.
          nullable: true
