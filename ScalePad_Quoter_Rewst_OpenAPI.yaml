          description: Unique identifier for the category.
        name:
          type: string
          example: Electronics
          description: The name of the category.
        parent_category:
          type: string
          nullable: true
          example: Technology
          description: The name of the parent category, if any.
        parent_category_id:
          type: string
          nullable: true
          example: cat_OcThl8SOeE8w6JYUznfrnQGdp94
          description: The unique identifier of the parent category, if any.
        record_created_at:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
          description: ISO 8601 timestamp when the record was created.
        record_updated_at:
          type: string
          format: date-time
          example: '2024-01-15T15:45:00Z'
          description: ISO 8601 timestamp when the record was last updated.
